# Static file server for the dashboard.
#
# Deliberately HTTP-only: the printer endpoints are ws:// and http://, so an
# HTTPS origin would turn both into mixed-content errors.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # The page is dashboard.html, not index.html.
    index dashboard.html;
    autoindex off;
    server_tokens off;

    location = /api/discover {
        proxy_pass http://discovery:8081;
        proxy_read_timeout 5s;
    }

    location /api/replay {
        proxy_pass http://discovery:8081;
        proxy_read_timeout 20s;
        client_max_body_size 8k;
    }

    # Pinned vendor bundle; safe to cache.
    location /vendor/ {
        try_files $uri =404;
    }

    # Application files are small and change together. Revalidating them keeps a
    # cached dashboard.html from pairing with a newer dashboard.js.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Don't serve repo plumbing (.git, .dockerignore) to the LAN.
    location ~ /\. {
        deny all;
    }
}
